<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FBT · Token candlestick terminal — material preview</title>
  <link rel="stylesheet" href="/src/index.css">
  <style>
    /* Preview chrome only — none of this ships with the route. */
    body { margin: 0; min-height: 100vh; }
    .pv-bar {
      position: sticky; inset-block-start: 0; z-index: 60; display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap; padding: 10px 16px;
      font: 600 12px/1 var(--font-display); color: var(--text-2);
      background: color-mix(in srgb, var(--bg-abyss) 88%, transparent);
      border-block-end: 1px solid var(--line);
    }
    .pv-bar b { color: var(--text-1); font-size: 13px; }
    .pv-bar button {
      font: 700 11px/1 var(--font-display); padding: 8px 11px; border-radius: 10px; cursor: pointer;
      color: var(--text-1); background: var(--bg-raised); border: 1px solid var(--line-strong);
    }
    .pv-bar button[aria-pressed='true'] { color: #04121a; background: var(--rgb-1); border-color: transparent; }
    .pv-wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 60px; }
    .pv-note { margin: 0 0 12px; color: var(--text-3); font: 500 11px/1.9 var(--font-display); }
    .pv-card { padding: 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-panel); }
  </style>
</head>
<body>
  <div class="pv-bar">
    <b>FBT · نمودار شمعی حرفه‌ای</b>
    <button type="button" id="pv-theme">تم روشن / تیره</button>
    <button type="button" id="pv-lang">فارسی / English</button>
    <button type="button" id="pv-symbol">ETH / PEPE</button>
    <span id="pv-info" style="opacity:.7"></span>
  </div>
  <div class="pv-wrap">
    <p class="pv-note">
      پیش‌نمایش متریال با داده‌ی مصنوعی و ثابت (بدون فید زنده). شیت واقعی
      <code>src/styles/pro-chart.css</code> و همان کامپوننت صفحهٔ توکن اینجا سوار شده‌اند:
      کارت شمعی، دکمهٔ کوچک بزرگ‌نمایی، و ترمینال تمام‌صفحهٔ افقی با ابزارهای تحلیل.
    </p>
    <div id="root"></div>
  </div>
  <script type="module" src="/test/fixtures/pro-chart.jsx"></script>
</body>
</html>
