name: Build Android APK

# Builds a debug APK on GitHub's runners (this repo's dev sandbox has no JDK or
# Android SDK, so compilation has to happen here). The artifact appears under
# the workflow run, and tagged builds also get attached to a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Gradle 8.2.1 / AGP 8.2.1 (pinned by Capacitor 6) support JDK 17.
      # JDK 21 fails here with "Unsupported class file major version 65".
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          # Public, client-side values. Anything secret must NOT live here —
          # VITE_* variables are compiled into the JS and readable by anyone.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_FEE_ROUTER_ADDRESS: ${{ vars.VITE_FEE_ROUTER_ADDRESS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ vars.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/FBT-Swap-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBT-Swap-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FBT Swap ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
          body: |
            ## FBT Swap — Android build

            **Install:** download the `.apk` below, then allow
            *Install unknown apps* for your browser when Android prompts you.

            This is a **debug-signed** build for testing and direct distribution.
            For Google Play you need a release build signed with your own
            upload key — see the README.

            ⚠️ Always verify you downloaded this from the official repository.
