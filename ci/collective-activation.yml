# ============================================================================
# FBT AI COLLECTIVE — KEYLESS, GAS-FREE ACTIVATION PIPELINE
#
# INSTALL: copy this whole file to .github/workflows/collective-activation.yml
# (GitHub blocks automation tokens from writing under .github/workflows/, so
# this copy lives here and the owner pastes it once in the GitHub UI).
#
# WHAT RUNS WITHOUT ANYBODY HOLDING A KEY
#   Job `rehearsal` runs on every push to main that touches the Collective, and
#   weekly. It needs NO repository secret and spends NO gas: it compiles the
#   contracts, runs the Ganache contract probe, the API/activation tests and the
#   complete local rehearsal (deploy → real 1-day timelock → activate → a user
#   deposit signed and paid by the user's own wallet → invest → read through the
#   production reader). It then publishes the evidence — contract bytecode
#   hashes, sizes and check results — to:
#       server/collective/activation.snapshot.js   (read by the API)
#       public/collective/activation.json          (public, auditable)
#   The commit-back is what makes the already-live site show a real, verifiable
#   pipeline status with no Vercel environment variable.
#
# WHY THERE IS STILL A `live` JOB (AND WHY IT IS OFF BY DEFAULT)
#   Contracts cannot be put on Robinhood Chain (4663) for free: an Arbitrum
#   Orbit chain charges gas in ETH. No key and no gas exist inside this
#   repository, and inventing either would be a lie. So the live job is:
#       · manual only (workflow_dispatch),
#       · gated by an explicit `acknowledge_gas=yes` input,
#       · gated by a repository secret the owner adds themselves,
#       · never printing, persisting or committing the key.
#   The deploying wallet pays the gas — there is no sponsor, relayer or
#   paymaster. Once phase 2 passes verification, the public read configuration
#   becomes automatic (the API reads the verified snapshot), so "run the
#   workflow once" is the whole operational step.
#
# ONE-TIME SETUP FOR THE LIVE JOB (entirely in the GitHub UI — no key is ever
# sent to anybody, including the person who wrote this file):
#   Settings → Secrets and variables → Actions
#     Secret    COLLECTIVE_DEPLOYER_PRIVATE_KEY   burner wallet key (pays gas)
#     Variable  COLLECTIVE_ASSET_ADDRESS          accounting stablecoin address
#     Variable  COLLECTIVE_GUARDIAN_ADDRESS       a different wallet than above
#     Variable  COLLECTIVE_RPC_URL               (optional) HTTPS RPC
#   Then: Actions → "FBT Collective Activation" → Run workflow
#         phase=deploy   acknowledge_gas=yes
#   After ≥ 1 day (RiskController timelock):
#         phase=activate acknowledge_gas=yes
#         phase=check    (no key needed)
# ============================================================================
name: FBT Collective Activation

on:
  push:
    branches: [main]
    paths:
      - 'contracts/collective/**'
      - 'server/collective/**'
      - 'scripts/collective-*.mjs'
      - 'scripts/lib/collectiveDeployment.mjs'
      - 'src/pages/Collective.jsx'
      - 'src/lib/collective/**'
      - 'src/styles/collective.css'
      - 'test/collective/**'
      - 'public/collective/**'
      - 'deployments/**'
      - '.github/workflows/collective-activation.yml'
  schedule:
    # Weekly, Monday 03:17 UTC — odd minute, outside the congested top of hour.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      phase:
        description: 'rehearse = keyless & gas-free · deploy/activate = your wallet pays gas · check = read-only'
        type: choice
        default: rehearse
        options: [rehearse, preflight, deploy, activate, check, testnet-deploy, testnet-activate, testnet-check]
      asset_address:
        description: 'Token contract on selected network (required for deploy/preflight; no guessing)'
        type: string
        required: false
      guardian_address:
        description: 'Guardian public address, different from deployer'
        type: string
        required: false
      deployer_address:
        description: 'Public deployer for read-only preflight/discovery'
        type: string
        default: '0xEfFEe508B69B8705F0AA3187aD9d28f1B95D39E9'
      timelock_days:
        description: 'RiskController delay: 1–30 days'
        type: string
        default: '1'
      acknowledge_gas:
        description: 'Type yes only if you accept that the deploying wallet pays real gas'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: collective-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Keyless rehearsal (no secrets, no gas)
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'rehearse' || inputs.phase == '')
      && !contains(github.event.head_commit.message, '[collective-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lockfile verified)
        run: npm ci --no-audit --no-fund

      - name: Mark start time
        run: echo "COLLECTIVE_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Compile Collective contracts (solc 0.8.24)
        run: npm run compile:collective

      - name: Contract probe (Ganache, no funds)
        run: node test/collective/contract-probe.mjs

      - name: API + activation tests
        run: node --test test/collective/api.test.mjs test/collective/activation.test.mjs test/collective/activation-status.test.mjs

      - name: Full local rehearsal (deploy → timelock → activate → deposit)
        run: node scripts/collective-deploy.mjs --local --rehearse

      - name: Write public activation evidence
        run: node scripts/collective-evidence.mjs --write --contract-ok --api-ok

      - name: Verify evidence (parses, no secret material)
        run: node scripts/collective-evidence.mjs --check

      - name: Upload rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-rehearsal-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            test/.out/collective-deployment.local.json
            server/collective/activation.snapshot.js
            public/collective/activation.json

      - name: Publish evidence to main
        # Public facts only: hashes, sizes, check results and (after a live run)
        # public contract addresses. Never a key, never RPC credentials.
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "fbt-collective-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/collective/activation.snapshot.js public/collective/activation.json
          if git diff --cached --quiet; then
            echo "::notice::Evidence unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(collective): keyless rehearsal evidence [collective-evidence]"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### FBT AI Collective — keyless pipeline"
            echo ""
            echo "| property | value |"
            echo "| --- | --- |"
            echo "| secrets used | **none** |"
            echo "| gas spent | **0** (in-process Ganache) |"
            echo "| commit | \`${GITHUB_SHA::7}\` |"
            echo "| run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Selected-network activation (operator pays gas)
    if: github.event_name == 'workflow_dispatch' && inputs.phase != 'rehearse'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COLLECTIVE_NETWORK: ${{ (startsWith(inputs.phase, 'testnet-') || inputs.phase == 'preflight') && 'robinhood-testnet' || 'robinhood' }}
      COLLECTIVE_CHAIN_ID: ${{ (startsWith(inputs.phase, 'testnet-') || inputs.phase == 'preflight') && '46630' || '4663' }}
      COLLECTIVE_RPC_URL: ${{ (startsWith(inputs.phase, 'testnet-') || inputs.phase == 'preflight') && 'https://rpc.testnet.chain.robinhood.com' || 'https://rpc.mainnet.chain.robinhood.com' }}
      COLLECTIVE_ASSET_ADDRESS: ${{ inputs.asset_address || vars.COLLECTIVE_ASSET_ADDRESS }}
      COLLECTIVE_GUARDIAN_ADDRESS: ${{ inputs.guardian_address || vars.COLLECTIVE_GUARDIAN_ADDRESS }}
      COLLECTIVE_DEPLOYER_ADDRESS: ${{ inputs.deployer_address || vars.COLLECTIVE_DEPLOYER_ADDRESS }}
      COLLECTIVE_LIVE_ACK: ${{ inputs.acknowledge_gas }}
      COLLECTIVE_PHASE: ${{ inputs.phase }}
      TIMELOCK_DAYS: ${{ inputs.timelock_days || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Resolve signing identity and guard transaction phases
        if: inputs.phase != 'preflight' && inputs.phase != 'check' && inputs.phase != 'testnet-check'
        env:
          COLLECTIVE_DEPLOYER_PRIVATE_KEY: ${{ secrets.COLLECTIVE_DEPLOYER_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { Wallet, isAddress } from 'ethers';
          const e = process.env;
          function fail(message) { console.error(message); process.exit(1); }
          if (e.COLLECTIVE_LIVE_ACK !== 'yes') fail('acknowledge_gas=yes required; operator pays gas');
          if (!e.COLLECTIVE_DEPLOYER_PRIVATE_KEY) fail('Set COLLECTIVE_DEPLOYER_PRIVATE_KEY in GitHub Secrets yourself. Never send it in chat.');
          let address;
          try { address = new Wallet(e.COLLECTIVE_DEPLOYER_PRIVATE_KEY).address; }
          catch { fail('Invalid signing secret (value suppressed)'); }
          const days = Number(e.TIMELOCK_DAYS);
          if (!Number.isInteger(days) || days < 1 || days > 30) fail('timelock_days must be 1–30');
          if (e.COLLECTIVE_PHASE.endsWith('deploy')) {
            if (!isAddress(e.COLLECTIVE_GUARDIAN_ADDRESS) || address.toLowerCase() === e.COLLECTIVE_GUARDIAN_ADDRESS.toLowerCase()) fail('Distinct guardian_address required');
          }
          fs.appendFileSync(e.GITHUB_ENV, `COLLECTIVE_DEPLOYER_ADDRESS=${address}\nCOLLECTIVE_POLICY_DELAY_SECONDS=${days * 86400}\n`);
          console.log(`Public deployer: ${address}`);
          JS
      - name: Discover TESTNET tokens (no token is auto-selected)
        if: env.COLLECTIVE_CHAIN_ID == '46630'
        run: node scripts/collective-discover-assets.mjs
      - name: Require explicit asset for preflight/deploy
        if: inputs.phase == 'preflight' || endsWith(inputs.phase, 'deploy')
        run: |
          if [ -z "$COLLECTIVE_ASSET_ADDRESS" ]; then
            echo '::error::asset_address is required. Select a TESTNET token from the discovery summary and rerun. Mainnet USDG must not be used.'
            exit 1
          fi
      - name: Read-only preflight
        if: inputs.phase == 'preflight' || endsWith(inputs.phase, 'deploy')
        run: node scripts/collective-preflight.mjs --network "$COLLECTIVE_NETWORK"
      - name: Compile and test
        if: inputs.phase != 'preflight'
        run: npm run test:collective
      - name: Deploy (queues timelock)
        if: endsWith(inputs.phase, 'deploy')
        env:
          COLLECTIVE_DEPLOYER_PRIVATE_KEY: ${{ secrets.COLLECTIVE_DEPLOYER_PRIVATE_KEY }}
        run: node scripts/collective-deploy.mjs --network "$COLLECTIVE_NETWORK" --phase deploy --execute
      - name: Activate (fails until real timelock has elapsed)
        if: endsWith(inputs.phase, 'activate')
        env:
          COLLECTIVE_DEPLOYER_PRIVATE_KEY: ${{ secrets.COLLECTIVE_DEPLOYER_PRIVATE_KEY }}
        run: node scripts/collective-deploy.mjs --network "$COLLECTIVE_NETWORK" --phase activate --execute
      - name: Verify on-chain (no key)
        if: endsWith(inputs.phase, 'activate') || endsWith(inputs.phase, 'check')
        run: node scripts/collective-activate.mjs --deployment "deployments/collective-${COLLECTIVE_CHAIN_ID}.json" --chain "$COLLECTIVE_CHAIN_ID" --check --mark-verified
      - name: Local rehearsal
        if: inputs.phase != 'preflight'
        run: node scripts/collective-deploy.mjs --local --rehearse
      - name: Write public evidence after successful checks only
        if: inputs.phase != 'preflight'
        env:
          COLLECTIVE_VERIFIED: ${{ (endsWith(inputs.phase, 'activate') || endsWith(inputs.phase, 'check')) && 'true' || 'false' }}
        run: |
          node scripts/collective-evidence.mjs --write --deployment "deployments/collective-${COLLECTIVE_CHAIN_ID}.json" --contract-ok --api-ok
          node scripts/collective-evidence.mjs --check
      - name: Publish only selected-chain record and public evidence
        if: inputs.phase != 'preflight' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'fbt-collective-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "deployments/collective-${COLLECTIVE_CHAIN_ID}.json" server/collective/activation.snapshot.js public/collective/activation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(collective): selected-network evidence [collective-evidence]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-public-${{ github.run_id }}
          path: |
            deployments/collective-${{ env.COLLECTIVE_CHAIN_ID }}.json
            public/collective/activation.json
