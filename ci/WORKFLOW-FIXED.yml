name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      # GitHub does NOT expose secrets to a script automatically — they only
      # reach the process through an explicit `env:` block. Without this the
      # build silently falls back to a debug APK even when all four secrets
      # are set, which looks like the keystore "not working".
      # Builds BOTH variants: the store APK/AAB and the full-feature APK.
      # Previously this ran ci/build-apk.sh, which produces only the store
      # build — so the full build existed as a script that nothing ever
      # executed, and every APK on the releases page was missing features.
      - run: bash ci/build-both.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          # Anything the code reads via import.meta.env must be listed here or
          # Vite bakes in the DEFAULT at build time. Setting VITE_FEE_BPS in
          # Vercel changes the website but leaves the APK on 0.5% — the fee
          # silently differs between platforms, which is the worst outcome
          # because both look correct in isolation.
          VITE_FEE_BPS: ${{ vars.VITE_FEE_BPS }}
          # The builder-code fee, for the day an order path exists. Same trap
          # as VITE_FEE_BPS above and worse: a builder fee is charged on
          # NOTIONAL, so at 20x a 5 bps difference between web and APK is a
          # 1%-of-capital difference to the trader. Listed now so the variable
          # cannot be introduced later and quietly miss the APK.
          VITE_BUILDER_BPS: ${{ vars.VITE_BUILDER_BPS }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          # The support address. Cafe Bazaar requires one on our own domain
          # rather than a Gmail account, so this will change - and if it is
          # not listed here, the WEBSITE would show the new address while the
          # APK kept showing the old one. A support address that is wrong on
          # one platform is worse than a missing one: the user writes into a
          # void and concludes the app is abandoned.
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_FEE_RECIPIENT: ${{ vars.VITE_FEE_RECIPIENT }}
          # Solana referral account. Without it the APK still swaps on Solana
          # and collects NO fee — Jupiter ignores a referralFee with no
          # account, so an unconfigured build is indistinguishable from a
          # working one until you check the balance.
          VITE_JUP_REFERRAL_ACCOUNT: ${{ vars.VITE_JUP_REFERRAL_ACCOUNT }}
          # Public affiliate identifiers, not secrets: both are meant to be
          # embedded in shared links. They are here because Vite inlines
          # VITE_ vars at BUILD time — set only in Vercel, the website would
          # earn and the APK would not, and nobody would notice for months.
          VITE_GMX_REF_CODE: ${{ vars.VITE_GMX_REF_CODE }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ vars.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          APP_VERSION_CODE: ${{ vars.APP_VERSION_CODE }}
          APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME }}

      # Upload whatever was produced. `if-no-files-found: ignore` on the AAB
      # keeps unsigned (debug) runs from failing the job.
      - uses: actions/upload-artifact@v4
        with:
          name: FBT-Swap-app
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: warn

      # Always refresh the rolling "latest" release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FBT Swap - latest
          files: |
            out/*.apk
            out/*.aab

      # AND, when the run was triggered by a version tag, attach the very same
      # artifacts to that tag's release.
      #
      # Without this, `tag_name: latest` was hardcoded, so a build triggered by
      # pushing v1.2.2 uploaded its APK to `latest` and left the v1.2.2 release
      # with no files at all. The version you tag is the one someone links to
      # months later, and it was always empty; the only downloadable build was
      # a rolling tag that silently changes underneath you, so "the APK from
      # v1.2.0" was never actually recoverable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            out/*.apk
            out/*.aab
