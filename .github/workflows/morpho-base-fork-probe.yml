name: Morpho Base fork probe
on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: 'Base mainnet RPC URL to fork'
        required: false
        default: 'https://mainnet.base.org'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Foundry (anvil)
        run: |
          set -euo pipefail
          VER=v1.8.1
          mkdir -p "$HOME/.foundry/bin"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/${VER}/foundry_${VER}_linux_amd64.tar.gz" -o /tmp/foundry.tar.gz
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          chmod +x "$HOME/.foundry/bin/anvil" "$HOME/.foundry/bin/cast" "$HOME/.foundry/bin/forge" "$HOME/.foundry/bin/chisel" 2>/dev/null || chmod +x "$HOME/.foundry/bin/anvil"
          "$HOME/.foundry/bin/anvil" --version
      - name: Lockfile platform guard (before npm ci)
        run: node ci/lock-platform-guard.mjs
      - name: Install dependencies (ethers + vite, used by the probe)
        run: npm ci --no-audit --no-fund
      - name: Run the Base mainnet fork probe (strict)
        id: probe
        env:
          BASE_RPC_URL: ${{ inputs.rpc_url }}
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -o pipefail
          npm run test:morpho-base-fork -- --strict 2>&1 | tee /tmp/morpho-base-fork-probe.log
          echo "probe_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarise
        if: always()
        run: |
          echo "### Morpho Base fork probe exit: ${{ steps.probe.outputs.probe_exit }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/morpho-base-fork-probe.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morpho-base-fork-probe.log
          path: /tmp/morpho-base-fork-probe.log
          if-no-files-found: error
