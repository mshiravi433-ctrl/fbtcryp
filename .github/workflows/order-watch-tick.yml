name: Order watch tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: order-watch-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance the order watch clock
        env:
          TICK_URL: https://fbtswap.ir/api/cron/watch
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET is not set — add it in Settings → Secrets and variables → Actions. Skipping this tick."
            exit 0
          fi

          echo "Ticking ${TICK_URL} …"
          curl --silent --show-error \
               --fail-with-body \
               --max-time 120 \
               -H "x-cron-secret: ${CRON_SECRET}" \
               "${TICK_URL}"
          echo
          echo "Tick complete."
