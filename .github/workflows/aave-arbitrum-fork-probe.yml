# ============================================================================
# AAVE V3 ARBITRUM · MAINNET FORK PROBE (MANUAL RUN)
#
# ONE-TIME SETUP (this file cannot be committed to .github/workflows by an
# agent — GitHub rejects app tokens there, so it is placed by hand, like
# ci/aave-base-fork-probe.yml):
#
#   1. Open the repo: github.com/mshiravi433-ctrl/fbtcryp
#   2. Add file  .github/workflows/aave-arbitrum-fork-probe.yml
#      (typing / creates folders; commit straight to the branch you want)
#   3. Actions tab → "Aave Arbitrum fork probe" → Run workflow.
#      Optional input rpc_url defaults to https://arb1.arbitrum.io/rpc — any
#      public Arbitrum RPC works if the default is rate-limited.
#
# WHAT IT DOES: installs Foundry on the runner, forks Arbitrum One mainnet
# state locally with anvil, and runs the REAL acceptance probe
# (test/aave-arbitrum-fork-probe.mjs --strict): pinned defaults, funding,
# verifyDeployment against the pinned Pool and the native-USDC (USDCn)
# reserve aToken, live reserve decode, supply 5 USDC with an exact approve,
# position read, withdraw max, and a real revert-code check. The full output
# is saved as the "aave-arbitrum-fork-probe.log" artifact and printed in the
# run log.
#
# SAFETY: nothing leaves the runner. anvil forks chain state locally; the
# "transactions" move test USDC between forked accounts only. No secrets, no
# deploy keys, no real funds. Public-repo Actions minutes are free.
# ============================================================================
name: Aave Arbitrum fork probe
on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: 'Arbitrum One mainnet RPC URL to fork'
        required: false
        default: 'https://arb1.arbitrum.io/rpc'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry (anvil)
        run: |
          # anvil straight from the official GitHub release tarball — the same
          # artifact foundryup installs, without depending on the third-party
          # installer domain foundry.paradigm.xyz (which intermittently fails
          # to serve the script, seen as exit 127 on `foundryup`).
          set -euo pipefail
          VER=v1.8.1
          mkdir -p "$HOME/.foundry/bin"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/${VER}/foundry_${VER}_linux_amd64.tar.gz" -o /tmp/foundry.tar.gz
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          chmod +x "$HOME/.foundry/bin/anvil" "$HOME/.foundry/bin/cast" "$HOME/.foundry/bin/forge" "$HOME/.foundry/bin/chisel" 2>/dev/null || chmod +x "$HOME/.foundry/bin/anvil"
          "$HOME/.foundry/bin/anvil" --version

      - name: DEBUG direct RPC reads across providers (no fork) [TEMPORARY]
        # Temporary diagnosis for the empty-storage fork failure: reads the
        # SAME USDC slot via 4 providers x 4 methods, with NO anvil involved.
        # If direct reads work everywhere, the fault is anvil's fork backend;
        # if a method fails on some providers, the fault is provider support.
        # Remove this step once the probe is green.
        run: |
          set +e
          export PATH="$HOME/.foundry/bin:$PATH"
          USDC=0xaf88d065e77c8cC2239327C5EDb3A432268e5831
          SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          ACCT=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          for RPC in https://arbitrum-one.publicnode.com https://arb1.arbitrum.io/rpc https://arbitrum.llamarpc.com https://1rpc.io/arb; do
            echo "===== $RPC ====="
            echo "-- code:"; cast code $USDC --rpc-url "$RPC" 2>&1 | head -c 120; echo
            echo "-- storage:"; cast storage $USDC $SLOT --rpc-url "$RPC" 2>&1 | head -c 120; echo
            echo "-- balanceOf:"; cast call $USDC "balanceOf(address)" $ACCT --rpc-url "$RPC" 2>&1 | head -c 200; echo
            echo "-- proof:"; curl -s -m 20 -X POST -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getProof\",\"params\":[\"$USDC\",[\"$SLOT\"],\"latest\"]}" "$RPC" 2>&1 | head -c 300; echo
          done

      - name: Lockfile platform guard (before npm ci)
        # Same step ci/build-apk.sh runs first: ganache's shrinkwrapped lockfile
        # pins macOS-only fsevents as a REQUIRED dependency, which makes `npm ci`
        # die with EBADPLATFORM on every Linux runner. The guard flips that one
        # entry to optional, in place, idempotently.
        run: node ci/lock-platform-guard.mjs

      - name: Install dependencies (ethers + vite, used by the probe)
        run: npm ci --no-audit --no-fund

      - name: Run the Arbitrum One mainnet fork probe (strict)
        id: probe
        env:
          ARBITRUM_RPC_URL: ${{ inputs.rpc_url }}
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -o pipefail
          npm run test:aave-arbitrum-fork -- --strict 2>&1 | tee /tmp/aave-arbitrum-fork-probe.log
          echo "probe_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          echo "### Aave Arbitrum fork probe exit: ${{ steps.probe.outputs.probe_exit }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 /tmp/aave-arbitrum-fork-probe.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-arbitrum-fork-probe.log
          path: /tmp/aave-arbitrum-fork-probe.log
          if-no-files-found: error
