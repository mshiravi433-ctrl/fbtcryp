# ============================================================================
# AAVE V3 BASE · MAINNET FORK PROBE (MANUAL RUN)
#
# Runs the REAL acceptance probe (test/aave-base-fork-probe.mjs) against a
# fresh anvil fork of Base mainnet, with public network access. The probe is
# deliberately NOT part of push/PR CI (see its header comment) — it is a
# manual, on-demand run: Actions -> "Aave Base fork probe" -> Run workflow.
#
# Optional input rpc_url: any public Base RPC (defaults to mainnet.base.org).
# The workflow is safe by construction: it only forks chain state locally on
# the runner and moves test USDC between forked accounts. No secrets, no
# deploy keys, no real transactions.
# ============================================================================
name: Aave Base fork probe
on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: 'Base mainnet RPC URL to fork'
        required: false
        default: 'https://mainnet.base.org'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry (anvil)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          anvil --version

      - name: Run the Base mainnet fork probe (strict)
        env:
          BASE_RPC_URL: ${{ inputs.rpc_url }}
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -o pipefail
          npm run test:aave-base-fork -- --strict 2>&1 | tee /tmp/aave-base-fork-probe.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_STATE"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-base-fork-probe.log
          path: /tmp/aave-base-fork-probe.log
          if-no-files-found: error
