# ============================================================================
# LIDO ETHEREUM · MAINNET FORK PROBE (MANUAL RUN)
#
# ONE-TIME SETUP (this file cannot be committed to .github/workflows by an
# agent — GitHub rejects app tokens there, so it is placed by hand, like
# ci/build-apk.yml):
#
#   1. Open the repo: github.com/mshiravi433-ctrl/fbtcryp
#   2. Add file  .github/workflows/lido-mainnet-fork-probe.yml
#      (typing / creates folders; commit straight to the branch you want)
#   3. Actions tab → "Lido mainnet fork probe" → Run workflow.
#      Optional inputs:
#        - rpc_url (default https://eth.llamarpc.com) — any public Ethereum RPC
#          that serves ARCHIVE state without a personal token. The probe needs
#          eth_getLogs over the forked queue's history, so a non-archive endpoint
#          (e.g. https://ethereum-rpc.publicnode.com) is rejected with a HTTP 403
#          "Archive requests require a personal token" and the probe FAILs (it
#          never counts a transport error as a pass). If rpc_url is unreachable,
#          the probe auto-fails over to eth-mainnet.public.blastapi.io,
#          eth.drpc.org and 1rpc.io/eth before giving up. Recommend leaving the
#          default and letting the probe pick a reachable archive endpoint.
#        - log_window (default 100000) — blocks to scan for a real finalized,
#          unclaimed WithdrawalRequested entry used for the claim/ownership proof.
#          Lower it on a rate-limited public RPC.
#        - log_chunk (default 10000) — eth_getLogs chunk size; the probe adaptively
#          shrinks it to whatever per-call range the chosen RPC allows (e.g. some
#          endpoints cap at 10 blocks), so this rarely needs to be set manually.
#
# WHAT IT DOES: installs Foundry (anvil) on the runner, forks Ethereum mainnet
# locally, and runs the REAL acceptance probe
# (test/lido-mainnet-fork-probe.mjs --strict): verifyDeployment, exact-ETH
# stake -> stETH position, exact approve + wrap to wstETH -> unwrap, request
# withdrawal (requestId decoded from the real WithdrawalRequested event),
# ownership / pending finalization, and a claim against a real finalized,
# unclaimed request in the forked queue. The full output is saved as the
# "lido-mainnet-fork-probe.log" artifact and printed in the run log.
#
# SAFETY: nothing leaves the runner. anvil forks chain state locally; the
# transactions move test ETH between forked accounts only. No secrets, no
# deploy keys, no real funds. Public-repo Actions minutes are free.
# ============================================================================
name: Lido mainnet fork probe
on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: 'Ethereum mainnet RPC URL to fork'
        required: false
        default: 'https://eth.llamarpc.com'
      log_window:
        description: 'Blocks to scan for a finalized/unclaimed request (getLogs window)'
        required: false
        default: '100000'
      anvil_start_timeout:
        description: 'Milliseconds to wait for anvil to boot its fork (raise for a slow/flaky archive RPC)'
        required: false
        default: '180000'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry (anvil)
        run: |
          # anvil straight from the official GitHub release tarball — the same
          # artifact foundryup installs, without depending on the third-party
          # installer domain foundry.paradigm.xyz (which intermittently fails
          # to serve the script, seen as exit 127 on `foundryup`).
          set -euo pipefail
          VER=v1.8.1
          mkdir -p "$HOME/.foundry/bin"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/${VER}/foundry_${VER}_linux_amd64.tar.gz" -o /tmp/foundry.tar.gz
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          chmod +x "$HOME/.foundry/bin/anvil" "$HOME/.foundry/bin/cast" "$HOME/.foundry/bin/forge" "$HOME/.foundry/bin/chisel" 2>/dev/null || chmod +x "$HOME/.foundry/bin/anvil"
          "$HOME/.foundry/bin/anvil" --version

      - name: Lockfile platform guard (before npm ci)
        # Same step ci/build-apk.sh runs first: ganache's shrinkwrapped lockfile
        # pins macOS-only fsevents as a REQUIRED dependency, which makes `npm ci`
        # die with EBADPLATFORM on every Linux runner. The guard flips that one
        # entry to optional, in place, idempotently.
        run: node ci/lock-platform-guard.mjs

      - name: Install dependencies (ethers + vite, used by the probe)
        run: npm ci --no-audit --no-fund

      - name: Run the Lido mainnet fork probe (strict)
        id: probe
        env:
          ETHEREUM_RPC_URL: ${{ inputs.rpc_url }}
          LIDO_LOG_WINDOW: ${{ inputs.log_window }}
          ANVIL_START_TIMEOUT_MS: ${{ inputs.anvil_start_timeout }}
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          set -o pipefail
          npm run test:lido-mainnet-fork -- --strict 2>&1 | tee /tmp/lido-mainnet-fork-probe.log
          echo "probe_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          echo "### Lido mainnet fork probe exit: ${{ steps.probe.outputs.probe_exit }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 /tmp/lido-mainnet-fork-probe.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lido-mainnet-fork-probe.log
          path: /tmp/lido-mainnet-fork-probe.log
          if-no-files-found: error
