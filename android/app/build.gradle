apply plugin: 'com.android.application'

android {
    namespace "ir.fbt.swap"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.fbt.swap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 45
        versionName "1.17.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Populated from environment variables in CI (see ci/build-apk.sh).
            // Falls back to unsigned so a local `assembleDebug` still works
            // without anyone needing the keystore.
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Only attach the signing config when a keystore was provided,
            // otherwise Gradle fails the build looking for a missing file.
            if (System.getenv("ANDROID_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    /*
     * This was logger.info, which is hidden at default Gradle verbosity - so a
     * build with no google-services.json looked completely successful and
     * produced an APK where push notifications silently never arrive. That is
     * the worst failure mode: everything appears to work until a user reports
     * that order alerts never fire.
     *
     * logger.warn is shown by default, so the omission is at least visible in
     * the CI log.
     */
    logger.warn("")
    logger.warn("========================================================")
    logger.warn(" WARNING: android/app/google-services.json is MISSING")
    logger.warn(" Native push (FCM) will NOT work in this build.")
    logger.warn(" Limit-order alerts will not arrive while the app is closed.")
    logger.warn(" Download it from the Firebase console > Project settings >")
    logger.warn(" Your apps > Android app 'ir.fbt.swap'.")
    logger.warn("========================================================")
    logger.warn("")
}
