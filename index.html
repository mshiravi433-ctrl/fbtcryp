<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      ═══════════════════════════════════════════════════════════════════════
      COIN ARTWORK — open the connection before it is needed.

      Every icon in the market list comes from coin-images.coingecko.com. The
      browser cannot start ANY of them until it has done a DNS lookup, a TCP
      handshake and a TLS negotiation with that host — on a slow mobile link
      that is 300-600 ms before the first byte of the first icon, and it does
      not begin until the React bundle has parsed and the list has rendered.

      `preconnect` moves that setup to the moment the HTML is parsed, in
      parallel with downloading the bundle, so by the time the list paints the
      connection is already warm.

      It is `preconnect` and NOT `preload`: preload would fetch a specific
      file, and we do not know which coins the user will see. And an
      unreachable host costs nothing here — a failed preconnect is silent and
      never blocks the parser, unlike the synchronous <script> tags described
      further down that caused the original "spins forever" bug.
    -->
    <link rel="preconnect" href="https://coin-images.coingecko.com" crossorigin />
    <link rel="dns-prefetch" href="https://coin-images.coingecko.com" />

    <!--
      ═══════════════════════════════════════════════════════════════════════
      iOS / iPadOS

      Safari ignores most of the web app manifest. `display: standalone`,
      `theme_color` and `name` are all read from these Apple-specific tags
      instead — with none of them present, adding the site to an iPhone home
      screen produced a plain Safari bookmark: it opened in a normal tab, with
      the address bar visible, using the page <title> (a 60-character SEO
      string) as the icon caption.

      That matters more here than it looks. There is no iOS build of this app
      and there never will be without an Apple Developer account (99 USD/yr,
      not purchasable from Iran) — so the home-screen PWA is the ONLY way an
      iPhone user can keep FBT Swap. Getting it wrong loses every iOS user.

        • apple-mobile-web-app-capable — launches without Safari chrome.
        • status-bar-style=black-translucent — the page draws UNDER the status
          bar, which is why the layout must respect env(safe-area-inset-top);
          it does (see .top-bar in index.css) and viewport-fit=cover above
          makes those insets non-zero.
        • apple-mobile-web-app-title — the short caption under the icon.
          Without it iOS uses <title>, which would be truncated mid-sentence.
      ═══════════════════════════════════════════════════════════════════════
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FBT Swap" />
    <!-- Stops iOS auto-linking every number that looks like a phone number.
         Wallet addresses and token amounts are full of digit runs, and Safari
         turning "0.00203928" into a blue tappable "call" link is a real thing
         that happens on financial pages. -->
    <meta name="format-detection" content="telephone=no" />
    <!--
      Web app manifest. Missing entirely until now, which had two effects:
      the site could not be installed to a home screen at all, and wallets
      that read a dapp's manifest when rendering a connection request found
      a 404 where the name and icon should be.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="dark" />

    <!--
      ═══════════════════════════════════════════════════════════════════════
      SEO AND SOCIAL PREVIEW

      Before this the page had a bare title ("FBT Swap") and a Persian-only
      description. Three consequences:

        1. Search engines had nothing to rank on. The title carried no
           keywords, so "decentralized exchange" or "swap BNB" could never
           match us, and the Persian-only description meant we were invisible
           to every non-Persian query.
        2. Every share - Telegram, X, WhatsApp, LinkedIn - rendered a bare
           link with no image and no summary, because there were no Open
           Graph or Twitter Card tags at all. That is the single biggest
           avoidable loss of click-through for a link people pass around.
        3. Listing sites (DappRadar, DefiLlama, CoinGecko) scrape exactly
           these tags to populate a directory entry. With none present, an
           application has to be filled in entirely by hand and often reads
           as a low-effort submission.

      The description is English because that is the language of the
      directories and of most search traffic; the app itself still opens in
      the user's own language.
      ═══════════════════════════════════════════════════════════════════════
    -->
    <!--
      TEN, not nine, and no Tron.

      This once said "9 Chains" and the description listed Tron. We now support
      nine EVM chains (BNB, Ethereum, Polygon, Arbitrum, Base, Optimism,
      Avalanche, Linea and Sonic) plus Solana. That is ten, and there is no
      Tron swap route at all — lib/chains.js mentions Tron only to warn that
      sending an EVM address to it burns the funds.

      This mattered more than a typo: it was the text Google had indexed, so
      the one thing the search engine knew about us was partly false. Someone
      arriving to swap on Tron finds nothing and leaves, and an advertised
      capability that does not exist is the kind of claim a store reviewer
      checks.
    -->
    <title>FBT Swap — Non-Custodial DEX &amp; Crypto Swap on 10 Chains</title>
    <meta

      content="Non-custodial crypto swaps on 10 networks: BNB Chain, Ethereum, Polygon, Arbitrum, Base, Optimism, Avalanche, Linea, Sonic and Solana. You hold your keys."
    />
    <meta

      content="dex, decentralized exchange, crypto swap, non-custodial wallet, bnb chain, defi, token swap, limit orders, dca"
    />
    <link rel="canonical" href="https://fbtswap.ir/" />

    <meta name="google-site-verification" content="oIj-xNDBERX6umKeDZTfwWTpS2kY-h3x_MUYcLtvJx4" />

    <!--
      NOTHING IN THIS <head> IS ALLOWED TO BLOCK RENDERING.

      The app used to load two third-party resources synchronously here:
      telegram.org/js/telegram-web-app.js and fonts.googleapis.com. Both are
      unreachable from a large share of Iranian networks. A classic <script>
      in <head> blocks the HTML parser until it resolves — so on those
      networks the browser sat on the boot spinner until the TCP connection
      finally timed out (30-90s), and the module bundle never started.
      That was the "it just spins forever" bug.

      Fonts are now self-hosted from /fonts, and the Telegram SDK is loaded
      asynchronously below with its own timeout.
    -->
    <link rel="preload" href="/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Self-hosted so the app renders identically with no internet at all. */
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-var.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
        font-style: normal;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/JetBrainsMono-var.woff2') format('woff2-variations');
        font-weight: 100 800;
        font-display: swap;
        font-style: normal;
      }

      /*
       * Boot screen colours must match the DEFAULT theme in
       * useSettingsStore.js, which is DARK. If these disagree, a fresh
       * install renders a white screen for the few hundred ms before React
       * mounts and then snaps to black — which reads as a rendering fault.
       *
       * A returning user who chose light still gets one dark frame here; the
       * inline script below reads their saved choice and fixes it before
       * paint, so in practice only genuinely-new installs see this.
       */
      html, body { background: #000; margin: 0; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg, #000);
        z-index: 999;
        transition: opacity 0.4s ease;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        /* Default is LIGHT ink because the boot canvas now defaults to black.
           This fallback and --boot-bg's must always be an opposing pair —
           setting one without the other produces black text on black, which
           is a blank screen with a spinner and no way to read the failure
           message underneath it. */
        color: var(--boot-fg, #ffffff);
        padding: 24px;
        text-align: center;
      }
      #boot .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #00e5ff, #7c4dff, #ff2d95, #00ff9d, #00e5ff);
        animation: boot-spin 1s linear infinite;
        position: relative;
      }
      #boot .ring::after {
        content: '';
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: var(--boot-bg, #000);
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }

      /* Shown by the watchdog when the bundle fails to boot, so the user gets
         a reason and a retry button instead of an eternal spinner. */
      #boot-fail { display: none; max-width: 340px; }
      #boot[data-failed='true'] .ring { display: none; }
      #boot[data-failed='true'] #boot-fail { display: block; }
      #boot-fail h2 { font-size: 17px; margin: 0 0 10px; }
      #boot-fail p { font-size: 13px; line-height: 1.85; color: #9aa4bf; margin: 0 0 8px; }
      #boot-fail code {
        display: block;
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        color: #5b647f;
        direction: ltr;
        margin-top: 12px;
        word-break: break-all;
      }
      #boot-fail button {
        margin-top: 16px;
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: 0;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #000;
        background: linear-gradient(120deg, #00e5ff, #7c4dff);
      }
    </style>
  </head>
  <body>
    <script>
      /*
       * PRE-PAINT THEME RESOLUTION
       *
       * The default theme is now DARK (useSettingsStore.js). A returning user
       * who chose LIGHT would otherwise get one dark frame before React
       * hydrates and switches — a visible flash on every launch.
       *
       * This is the exact mirror of what it did before the default flipped.
       * Getting the direction wrong here does not break anything, it just
       * makes every launch flash, which is the kind of fault people report as
       * "the app feels broken" without being able to say why.
       *
       * It reads the persisted zustand blob and sets the boot colours before
       * the first paint. Deliberately tiny, synchronous and wrapped in
       * try/catch: it runs before anything else, so it must not be able to
       * break the app. If it throws or storage is unavailable we keep the
       * dark default, which is now also what a brand-new install wants.
       */
      (function () {
        try {
          var raw = localStorage.getItem('fbt-settings-v1');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (theme === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme !== 'light') {
            /*
             * Dark is the default, and it is now WRITTEN to the DOM rather
             * than left implicit. index.css keeps a prefers-color-scheme
             * fallback for a JS-less load, and that fallback used to win on
             * any device whose OS is in light mode — painting a white canvas
             * under the dark app for users who never chose light. An explicit
             * data-theme here shuts that window: the resolved theme exists on
             * <html> from the first frame, so only the user's actual choice
             * (or this dark default) can ever apply.
             */
            theme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.style.setProperty('--boot-bg', '#f4f5fa');
            document.documentElement.style.setProperty('--boot-fg', '#0f172a');
            document.documentElement.style.background = '#f4f5fa';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#f4f5fa');
          }
        } catch (e) {
          /* keep the dark default even if storage is unavailable */
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="boot">
      <div class="ring"></div>
      <div id="boot-fail">
        <h2>برنامه بالا نیامد</h2>
        <p>بارگذاری برنامه بیشتر از حد معمول طول کشید. معمولاً یعنی اتصال اینترنت قطع شده یا فایل‌های برنامه ناقص دانلود شده‌اند.</p>
        <p>دکمه زیر را بزنید تا دوباره تلاش شود. اگر باز هم نشد، اینترنت را عوض کنید (داده موبایل ↔ وای‌فای) و دوباره امتحان کنید.</p>
        <code id="boot-diag"></code>
        <button onclick="location.reload()">تلاش دوباره</button>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // ---------------------------------------------------------------------
      // Telegram Mini App SDK — loaded async, never blocking.
      // Outside Telegram (browser, APK) this simply never resolves anything
      // and the app runs standalone; TelegramContext already tolerates that.
      // ---------------------------------------------------------------------
      (function () {
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.async = true;
        document.head.appendChild(s);
      })();

      // ---------------------------------------------------------------------
      // Boot watchdog. main.jsx sets window.__FBT_BOOTED__ once React paints.
      // If that hasn't happened after 12s the bundle is broken or the network
      // died mid-download — say so instead of spinning forever.
      // ---------------------------------------------------------------------
      window.__FBT_BOOT_ERR__ = '';
      window.addEventListener('error', function (e) {
        if (!window.__FBT_BOOT_ERR__) {
          window.__FBT_BOOT_ERR__ = String((e && (e.message || (e.target && e.target.src))) || 'error');
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (!window.__FBT_BOOT_ERR__) {
          window.__FBT_BOOT_ERR__ = String((e && e.reason && e.reason.message) || 'promise');
        }
      });

      setTimeout(function () {
        if (window.__FBT_BOOTED__) return;
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.setAttribute('data-failed', 'true');
        var diag = document.getElementById('boot-diag');
        if (diag) diag.textContent = (window.__FBT_BOOT_ERR__ || 'timeout after 12s').slice(0, 220);
      }, 12000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
