<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fa" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Web app manifest. Missing entirely until now, which had two effects:
      the site could not be installed to a home screen at all, and wallets
      that read a dapp's manifest when rendering a connection request found
      a 404 where the name and icon should be.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="dark" />

    <!--
      ═══════════════════════════════════════════════════════════════════════
      SEO AND SOCIAL PREVIEW

      Before this the page had a bare title ("FBT Swap") and a Persian-only
      description. Three consequences:

        1. Search engines had nothing to rank on. The title carried no
           keywords, so "decentralized exchange" or "swap BNB" could never
           match us, and the Persian-only description meant we were invisible
           to every non-Persian query.
        2. Every share - Telegram, X, WhatsApp, LinkedIn - rendered a bare
           link with no image and no summary, because there were no Open
           Graph or Twitter Card tags at all. That is the single biggest
           avoidable loss of click-through for a link people pass around.
        3. Listing sites (DappRadar, DefiLlama, CoinGecko) scrape exactly
           these tags to populate a directory entry. With none present, an
           application has to be filled in entirely by hand and often reads
           as a low-effort submission.

      The description is English because that is the language of the
      directories and of most search traffic; the app itself still opens in
      the user's own language.
      ═══════════════════════════════════════════════════════════════════════
    -->
    <title>FBT Swap — Non-Custodial DEX &amp; Crypto Swap on 9 Chains</title>
    <meta
      name="description"
      content="Swap crypto across BNB Chain, Ethereum, Polygon, Arbitrum, Base, Optimism, Avalanche, Solana and Tron. Non-custodial: you hold your keys, you sign every trade. Live prices, limit orders and DCA."
    />
    <meta
      name="keywords"
      content="dex, decentralized exchange, crypto swap, non-custodial wallet, bnb chain, defi, token swap, limit orders, dca"
    />
    <link rel="canonical" href="https://www.lawpoetics.ir/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph: Telegram, WhatsApp, LinkedIn, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FBT Swap" />
    <meta property="og:title" content="FBT Swap — Non-Custodial DEX &amp; Crypto Swap" />
    <meta
      property="og:description"
      content="Swap crypto across 9 networks without giving up your keys. Live prices, limit orders and DCA, in 12 languages."
    />
    <meta property="og:url" content="https://www.lawpoetics.ir/" />
    <meta property="og:image" content="https://www.lawpoetics.ir/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fa_IR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CompanyFbt" />
    <meta name="twitter:title" content="FBT Swap — Non-Custodial DEX" />
    <meta
      name="twitter:description"
      content="Swap crypto across 9 networks without giving up your keys."
    />
    <meta name="twitter:image" content="https://www.lawpoetics.ir/icon-512.png" />

    <!--
      Structured data. This is what a directory or a search engine reads to
      build a rich result: name, category, price, platform. Without it we are
      an untyped page; with it we are a recognised SoftwareApplication.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FBT Swap",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Android, Web",
        "url": "https://www.lawpoetics.ir/",
        "description": "Non-custodial decentralized exchange interface. Swap crypto across nine networks while holding your own keys.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Organization",
          "name": "Fanous Bazaar Pishgam Co.",
          "email": "fbtswap@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Khomeyni Shahr",
            "addressRegion": "Isfahan",
            "addressCountry": "IR"
          }
        }
      }
    </script>

    <!--
      NOTHING IN THIS <head> IS ALLOWED TO BLOCK RENDERING.

      The app used to load two third-party resources synchronously here:
      telegram.org/js/telegram-web-app.js and fonts.googleapis.com. Both are
      unreachable from a large share of Iranian networks. A classic <script>
      in <head> blocks the HTML parser until it resolves — so on those
      networks the browser sat on the boot spinner until the TCP connection
      finally timed out (30-90s), and the module bundle never started.
      That was the "it just spins forever" bug.

      Fonts are now self-hosted from /fonts, and the Telegram SDK is loaded
      asynchronously below with its own timeout.
    -->
    <link rel="preload" href="/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Self-hosted so the app renders identically with no internet at all. */
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-var.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
        font-style: normal;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/JetBrainsMono-var.woff2') format('woff2-variations');
        font-weight: 100 800;
        font-display: swap;
        font-style: normal;
      }

      /*
       * Boot screen colours must match the DEFAULT theme in
       * useSettingsStore.js, which is light. If these disagree, a fresh
       * install renders a black screen for the few hundred ms before React
       * mounts and then snaps to light — which reads as a rendering fault.
       *
       * A returning user who chose dark still gets one light frame here; the
       * inline script below reads their saved choice and fixes it before
       * paint, so in practice only genuinely-new installs see this.
       */
      html, body { background: #f4f5fa; margin: 0; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg, #f4f5fa);
        z-index: 999;
        transition: opacity 0.4s ease;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        color: var(--boot-fg, #0b1220);
        padding: 24px;
        text-align: center;
      }
      #boot .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #00e5ff, #7c4dff, #ff2d95, #00ff9d, #00e5ff);
        animation: boot-spin 1s linear infinite;
        position: relative;
      }
      #boot .ring::after {
        content: '';
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: var(--boot-bg, #f4f5fa);
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }

      /* Shown by the watchdog when the bundle fails to boot, so the user gets
         a reason and a retry button instead of an eternal spinner. */
      #boot-fail { display: none; max-width: 340px; }
      #boot[data-failed='true'] .ring { display: none; }
      #boot[data-failed='true'] #boot-fail { display: block; }
      #boot-fail h2 { font-size: 17px; margin: 0 0 10px; }
      #boot-fail p { font-size: 13px; line-height: 1.85; color: #9aa4bf; margin: 0 0 8px; }
      #boot-fail code {
        display: block;
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        color: #5b647f;
        direction: ltr;
        margin-top: 12px;
        word-break: break-all;
      }
      #boot-fail button {
        margin-top: 16px;
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: 0;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #000;
        background: linear-gradient(120deg, #00e5ff, #7c4dff);
      }
    </style>
  </head>
  <body>
    <script>
      /*
       * PRE-PAINT THEME RESOLUTION
       *
       * The default theme is light (useSettingsStore.js). A returning user who
       * chose dark would otherwise get one light frame before React hydrates
       * and switches — a visible flash on every launch.
       *
       * This reads the persisted zustand blob and sets the boot colours before
       * the first paint. It is deliberately tiny, synchronous and wrapped in
       * try/catch: it runs before anything else, so it must not be able to
       * break the app. If it throws or storage is unavailable we simply keep
       * the light default.
       */
      (function () {
        try {
          var raw = localStorage.getItem('fbt-settings-v1');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (theme === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.setProperty('--boot-bg', '#000');
            document.documentElement.style.setProperty('--boot-fg', '#fff');
            document.documentElement.style.background = '#000';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#000000');
          }
        } catch (e) {
          /* keep the light default */
        }
      })();
    </script>
    <div id="boot">
      <div class="ring"></div>
      <div id="boot-fail">
        <h2>برنامه بالا نیامد</h2>
        <p>بارگذاری برنامه بیشتر از حد معمول طول کشید. معمولاً یعنی اتصال اینترنت قطع شده یا فایل‌های برنامه ناقص دانلود شده‌اند.</p>
        <p>دکمه زیر را بزنید تا دوباره تلاش شود. اگر باز هم نشد، اینترنت را عوض کنید (داده موبایل ↔ وای‌فای) و دوباره امتحان کنید.</p>
        <code id="boot-diag"></code>
        <button onclick="location.reload()">تلاش دوباره</button>
      </div>
    </div>
    <div id="root"></div>

    <script>
      // ---------------------------------------------------------------------
      // Telegram Mini App SDK — loaded async, never blocking.
      // Outside Telegram (browser, APK) this simply never resolves anything
      // and the app runs standalone; TelegramContext already tolerates that.
      // ---------------------------------------------------------------------
      (function () {
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.async = true;
        document.head.appendChild(s);
      })();

      // ---------------------------------------------------------------------
      // Boot watchdog. main.jsx sets window.__FBT_BOOTED__ once React paints.
      // If that hasn't happened after 12s the bundle is broken or the network
      // died mid-download — say so instead of spinning forever.
      // ---------------------------------------------------------------------
      window.__FBT_BOOT_ERR__ = '';
      window.addEventListener('error', function (e) {
        if (!window.__FBT_BOOT_ERR__) {
          window.__FBT_BOOT_ERR__ = String((e && (e.message || (e.target && e.target.src))) || 'error');
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (!window.__FBT_BOOT_ERR__) {
          window.__FBT_BOOT_ERR__ = String((e && e.reason && e.reason.message) || 'promise');
        }
      });

      setTimeout(function () {
        if (window.__FBT_BOOTED__) return;
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.setAttribute('data-failed', 'true');
        var diag = document.getElementById('boot-diag');
        if (diag) diag.textContent = (window.__FBT_BOOT_ERR__ || 'timeout after 12s').slice(0, 220);
      }, 12000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
